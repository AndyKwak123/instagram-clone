name: Deploy Instagram Clone to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the code
      - uses: actions/checkout@v4

      # 2. Set up Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Build the project
      - name: Build
        run: CI=false npm run build
        
        # Make sure your package.json has a build script

      # 5. Upload the build folder
      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist       # <-- Change this if your build folder is different
                              # Vite/Hydrogen: dist
                              # CRA: build
                              # Next.js static export: out

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      # 6. Deploy to GitHub Pages
      - uses: actions/deploy-pages@v4
